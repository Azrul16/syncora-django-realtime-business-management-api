name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: syncora_test
          POSTGRES_USER: syncora_user
          POSTGRES_PASSWORD: syncora_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncora_user -d syncora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-for-syncora-tests-only
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: syncora_test
      DB_USER: syncora_user
      DB_PASSWORD: syncora_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_CONN_MAX_AGE: 0
      DJANGO_LOG_LEVEL: WARNING
      SYNCORA_REQUEST_LOG_LEVEL: WARNING
      SYNCORA_EVENT_LOG_LEVEL: WARNING
      SYNCORA_SECURITY_LOG_LEVEL: WARNING

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file schema.yml

      - name: Run tests
        run: python manage.py test
